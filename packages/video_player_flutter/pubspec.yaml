name: video_player_flutter
description: Low-memory HLS video player for Flutter (Media3 ExoPlayer / AVPlayer).
version: 0.0.1
publish_to: none
homepage: https://github.com/vorzela/video_player_flutter

environment:
  sdk: ^3.3.0
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  video_player_flutter_platform_interface:
    path: ../video_player_flutter_platform_interface
  video_player_flutter_android:
    path: ../video_player_flutter_android
  video_player_flutter_ios:
    path: ../video_player_flutter_ios

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: ^22.7.0

flutter:
  plugin:
    platforms:
      android:
        default_package: video_player_flutter_android
      ios:
        default_package: video_player_flutter_ios
