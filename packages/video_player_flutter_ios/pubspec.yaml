name: video_player_flutter_ios
description: iOS AVPlayer implementation for video_player_flutter.
version: 0.0.3
publish_to: none

environment:
  sdk: ^3.3.0
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  video_player_flutter_platform_interface:
    path: ../video_player_flutter_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    implements: video_player_flutter
    platforms:
      ios:
        pluginClass: VideoPlayerFlutterPlugin
        dartPluginClass: VideoPlayerFlutterIOS
